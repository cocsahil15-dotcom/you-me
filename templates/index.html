<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>I Love You 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  background: #050008;
  overflow: hidden;
  touch-action: none;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  position: relative;
}

canvas {
  display: block;
  touch-action: none;
}

.glow-bg {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -54%);
  width: min(90vw, 500px);
  height: min(90vw, 500px);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(200,80,140,0.14) 0%, transparent 70%);
  pointer-events: none;
  animation: breathe 4s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { transform: translate(-50%,-54%) scale(1); opacity: 0.8; }
  50%      { transform: translate(-50%,-54%) scale(1.18); opacity: 1; }
}

/* ── top label ── */
.top-label {
  position: fixed;
  top: max(1.4rem, env(safe-area-inset-top, 1.4rem));
  left: 50%; transform: translateX(-50%);
  font-size: clamp(0.52rem, 2vw, 0.62rem);
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: rgba(220,140,180,0.3);
  white-space: nowrap;
}

/* ── message ── */
.message-wrap {
  position: fixed;
  bottom: max(6.5rem, calc(env(safe-area-inset-bottom, 0px) + 6.5rem));
  left: 50%; transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  width: 90vw;
}

.message-main {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.5rem, 7vw, 2.8rem);
  font-weight: 300;
  font-style: italic;
  color: #fff;
  letter-spacing: 0.05em;
  line-height: 1.2;
  text-shadow: 0 0 40px rgba(230,100,160,0.8), 0 0 80px rgba(200,80,140,0.35);
  animation: shimmer 4s ease-in-out infinite;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.message-sub {
  font-size: clamp(0.55rem, 2.2vw, 0.65rem);
  font-weight: 300;
  color: rgba(220,140,180,0.45);
  letter-spacing: 0.32em;
  text-transform: uppercase;
  margin-top: 0.55rem;
  animation: shimmer 4s ease-in-out infinite;
  animation-delay: 0.5s;
}
@keyframes shimmer {
  0%,100% { opacity: 0.65; }
  50%      { opacity: 1; }
}
.message-main.fade-out { opacity: 0; transform: translateY(8px); }

/* ── controls ── */
.controls {
  position: fixed;
  bottom: max(1.6rem, env(safe-area-inset-bottom, 1.6rem));
  left: 50%; transform: translateX(-50%);
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.btn {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(220,120,170,0.22);
  color: rgba(220,140,180,0.75);
  padding: 0.45rem 0.9rem;
  border-radius: 30px;
  font-size: clamp(0.6rem, 2.5vw, 0.68rem);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.25s;
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
  -webkit-user-select: none; user-select: none;
  /* bigger tap target on mobile */
  min-height: 40px;
  display: flex; align-items: center;
}
.btn:active {
  background: rgba(220,100,160,0.18);
  border-color: rgba(220,120,170,0.6);
  transform: scale(0.95);
}

.dot-sep {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: rgba(220,120,170,0.28);
  flex-shrink: 0;
}

/* hint for drag */
.drag-hint {
  position: fixed;
  top: max(3rem, calc(env(safe-area-inset-top,0px) + 3rem));
  left: 50%; transform: translateX(-50%);
  font-size: 0.58rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(220,140,180,0.2);
  animation: hintFade 5s ease forwards;
  white-space: nowrap;
}
@keyframes hintFade {
  0%   { opacity: 0; }
  20%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>

<div class="glow-bg"></div>
<div class="top-label">✦ &nbsp; just for you &nbsp; ✦</div>
<div class="drag-hint">drag to spin</div>
<canvas id="c"></canvas>

<div class="message-wrap">
  <div class="message-main" id="msg-text">i love you</div>
  <div class="message-sub"  id="msg-sub">always &amp; forever</div>
</div>

<div class="controls">
  <button class="btn" id="pauseBtn" onclick="togglePause()">⏸ pause</button>
  <div class="dot-sep"></div>
  <button class="btn" onclick="changeColor()">◐ colour</button>
  <div class="dot-sep"></div>
  <button class="btn" onclick="changeText()">✦ message</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ── themes ── */
const themes = [
  { near:[255,180,210], far:[110,30,70],  glow:'rgba(220,100,150,' },
  { near:[200,170,255], far:[70,30,150],  glow:'rgba(160,110,245,' },
  { near:[120,230,255], far:[15,80,125],  glow:'rgba(70,195,240,'  },
  { near:[255,205,120], far:[155,55,8],   glow:'rgba(240,160,55,'  },
  { near:[150,255,185], far:[15,95,48],   glow:'rgba(90,220,130,'  },
];
let themeIdx = 0, theme = themes[0];

/* ── messages ── */
const messages = [
  { main:'i love you',        sub:'always & forever'        },
  { main:'you are my world',  sub:'every single day'        },
  { main:'forever yours',     sub:'no matter what'          },
  { main:'my heart, my home', sub:'where you are'           },
  { main:'tu eres mi todo',   sub:'siempre y para siempre'  },
  { main:'darling',           sub:'you make everything glow'},
];
let msgIdx = 0;

function setMessage(i) {
  const el  = document.getElementById('msg-text');
  const sub = document.getElementById('msg-sub');
  el.classList.add('fade-out');
  setTimeout(() => {
    el.textContent  = messages[i].main;
    sub.textContent = messages[i].sub;
    el.classList.remove('fade-out');
  }, 480);
}

/* ── heart maths ── */
const hx = t => 16 * Math.pow(Math.sin(t), 3);
const hy = t => -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));

/* ── build points ── */
const LAYERS = 24, PPL = 115;
let pts = [];

function buildHeart() {
  pts = [];
  const word = messages[msgIdx].main + ' ';
  for (let l = 0; l < LAYERS; l++) {
    const depth = (l/(LAYERS-1) - 0.5) * 2;
    const sc    = Math.sqrt(Math.max(0, 1 - depth*depth*0.55)) * 0.88 + 0.12;
    for (let i = 0; i < PPL; i++) {
      const t = (i/PPL) * Math.PI * 2;
      pts.push({
        ox: hx(t)*sc + (Math.random()-.5)*0.22,
        oy: hy(t)*sc + (Math.random()-.5)*0.22,
        oz: depth*5  + (Math.random()-.5)*0.22,
        ci: Math.floor(Math.random() * word.length),
        op: 0.55 + Math.random()*0.45,
        sz: 0.7  + Math.random()*0.65,
      });
    }
  }
}
buildHeart();

/* ── rotation state ── */
let yAngle = 0, tilt = 0, tiltDir = 1, paused = false;

/* ── drag (mouse + touch) ── */
let dragging = false, lastX = 0, velX = 0, prevX = 0;

function startDrag(x) { dragging = true; lastX = prevX = x; velX = 0; }
function moveDrag(x)  {
  if (!dragging) return;
  const dx = x - lastX;
  velX = dx;
  yAngle += dx * 0.009;
  prevX = lastX; lastX = x;
}
function endDrag()    { dragging = false; }

canvas.addEventListener('mousedown',  e => startDrag(e.clientX));
canvas.addEventListener('mousemove',  e => moveDrag(e.clientX));
canvas.addEventListener('mouseup',    endDrag);
canvas.addEventListener('mouseleave', endDrag);

canvas.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e.touches[0].clientX); }, { passive:false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); moveDrag(e.touches[0].clientX);  }, { passive:false });
canvas.addEventListener('touchend',   e => { e.preventDefault(); endDrag(); }, { passive:false });

/* ── rotation helpers ── */
const ry = (x,y,z,a) => ({ x:x*Math.cos(a)+z*Math.sin(a), y, z:-x*Math.sin(a)+z*Math.cos(a) });
const rx = (x,y,z,a) => ({ x, y:y*Math.cos(a)-z*Math.sin(a), z:y*Math.sin(a)+z*Math.cos(a) });

function lerpColor(d) {
  const [r1,g1,b1]=theme.near, [r2,g2,b2]=theme.far;
  return [Math.round(r2+(r1-r2)*d), Math.round(g2+(g1-g2)*d), Math.round(b2+(b1-b2)*d)];
}

/* ── render ── */
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  const cx   = W/2, cy = H/2;
  const unit = Math.min(W,H) * 0.020;

  if (!dragging) {
    tilt += 0.0018 * tiltDir;
    if (Math.abs(tilt) > 0.22) tiltDir *= -1;
    // inertia
    yAngle += velX * 0.004;
    velX   *= 0.92;
  }

  const word   = messages[msgIdx].main + '  ';
  const mapped = pts.map(p => {
    let {x,y,z} = ry(p.ox, p.oy, p.oz, yAngle);
    ({x,y,z}   = rx(x, y, z, tilt - 0.26));
    const persp = 30/(30+z);
    return { sx:cx+x*unit*persp, sy:cy+y*unit*persp, d:(z+6)/12, p, persp };
  });

  mapped.sort((a,b) => a.d - b.d);

  mapped.forEach(({ sx, sy, d, p, persp }) => {
    const ch  = word[p.ci % word.length];
    const fs  = Math.max(7, p.sz * 13 * persp);
    const alp = (0.12 + d*0.88) * p.op;

    ctx.shadowColor = d > 0.58 ? theme.glow + '0.85)' : 'transparent';
    ctx.shadowBlur  = d > 0.58 ? 14*d : 0;

    const [r,g,b] = lerpColor(d);
    ctx.fillStyle  = `rgba(${r},${g},${b},${alp.toFixed(3)})`;
    ctx.font       = `300 ${fs.toFixed(1)}px 'DM Mono', monospace`;
    ctx.fillText(ch, sx, sy);
  });

  ctx.shadowBlur = 0;
  if (!dragging) yAngle += 0.005;
}

function loop() {
  if (!paused) draw();
  requestAnimationFrame(loop);
}
loop();

/* ── controls ── */
function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ play' : '⏸ pause';
}
function changeColor() {
  themeIdx = (themeIdx+1) % themes.length;
  theme    = themes[themeIdx];
}
function changeText() {
  msgIdx = (msgIdx+1) % messages.length;
  setMessage(msgIdx);
  const word = messages[msgIdx].main + ' ';
  pts.forEach(p => { p.ci = Math.floor(Math.random()*word.length); });
}
</script>
</body>
</html>
